<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>镇武孤城 Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
        window.addEventListener('error', function(e) {
            const err = document.createElement('div');
            err.style = 'color:red;z-index:9999;position:fixed;top:0;left:0;background:black;padding:20px;font-size:12px;font-family:monospace;max-width:100vw;white-space:pre-wrap;';
            err.textContent = 'Error: ' + e.message + '\n' + (e.error?.stack || '') + '\n' + e.filename + ':' + e.lineno;
            document.body.appendChild(err);
        });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
