<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>镇武孤城 Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,0,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
  </head>
  <body>
        <script>
            window.addEventListener('error', function(e) {
                const err = document.createElement('div');
                err.style = 'color:red;z-index:9999;position:fixed;top:0;left:0;background:black;padding:20px;font-size:12px;font-family:monospace;max-width:100vw;white-space:pre-wrap;';
                err.textContent = 'Error: ' + e.message + '\n' + (e.error?.stack || '') + '\n' + e.filename + ':' + e.lineno;
                document.body.appendChild(err);
            });
        </script>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
